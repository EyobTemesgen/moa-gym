# Local development and testing without SSL certificates:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   # or use: npm run docker:local
#   # then open http://localhost:3005
#
# Staging and production use docker-compose.yml with HTTPS.

services:
  db:
    ports: !override
      - "5436:5432"

  backend:
    environment:
      APP_ENV: dev
      NODE_ENV: development
    ports: !override
      - "5005:5005"

  nginx:
    ports: !override
      - "${LOCAL_PORT:-3005}:80"
    volumes: !override
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
