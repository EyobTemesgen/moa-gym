# MoA Staff Wellness & Gym Management System: PostgreSQL database, NestJS API, and Nginx (PWA + HTTPS).
#
# Production run:
#   cp .env.example .env              # set secure passwords & JWT secret
#   # Place SSL certs in ./ssl/fullchain.pem and ./ssl/privkey.pem
#   docker compose up -d --build
#
# See docs/DEPLOYMENT.md.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: moa-gym-db
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - moa_gym_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moa_gym_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-moa_gym_db}
      TZ: ${TZ:-Africa/Addis_Ababa}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moa_gym_user} -d ${POSTGRES_DB:-moa_gym_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── NestJS API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        APP_COMMIT: ${APP_COMMIT:-dev}
    image: moa-gym-backend:latest
    container_name: moa-gym-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5005
      DATABASE_URL: postgresql://${POSTGRES_USER:-moa_gym_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-moa_gym_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      TZ: ${TZ:-Africa/Addis_Ababa}
      APP_ENV: ${APP_ENV:-prod}
    expose:
      - "5005"

  # ── Nginx: Web App (PWA) & API Gateway ────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        APP_COMMIT: ${APP_COMMIT:-dev}
    image: moa-gym-nginx:latest
    container_name: moa-gym-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro

volumes:
  moa_gym_db_data:
